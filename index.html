<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>每周日程 · 我的作息表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html{color-scheme:dark}html,body{background:#0b0e14;color:#e9ebf0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}button{font-family:inherit;cursor:pointer}.wrap{max-width:560px;margin:0 auto;padding:16px 14px 96px;position:relative;min-height:100vh}.hd{display:flex;align-items:center;gap:8px;padding:6px 2px 10px}.title{font-size:20px;font-weight:750;letter-spacing:.5px}.sub{font-size:11px;color:#98a1b3;margin-top:4px}.seg{margin-left:auto;display:flex;gap:2px;background:#161b26;border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:3px}.seg button{font-size:11.5px;font-weight:650;color:#9aa3b4;padding:5px 12px;border-radius:999px;background:transparent;border:0}.seg button.on{background:#e9ebf0;color:#0b0e14}.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#9aa3b4;font-size:12px;white-space:nowrap}.chip.on{background:#e9ebf0;color:#0b0e14;border-color:transparent;font-weight:650}.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}.gbody{position:relative}.gut{position:absolute;left:0;width:44px;font-size:10px;color:#5d6675}.gut span{position:absolute;left:4px;transform:translateY(-50%)}.glines{position:absolute;left:46px;right:0}.glines .gl{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.06)}.cols{display:flex;margin-left:46px}.col{flex:1 1 0;min-width:0;padding:0 2px}.dh{height:34px;line-height:34px;text-align:center;font-size:11px;color:#aab2c2;font-weight:600}.track{position:relative}.ev{position:absolute;left:0;right:1px;border-radius:9px;border:1px solid;padding:5px 6px 4px 8px;overflow:hidden;text-align:left}.ev::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--c)}.ev b{display:block;font-size:10px;font-weight:650;line-height:1.25;color:#e9ebf0}.ev i{display:block;font-style:normal;font-size:8.5px;color:#aeb6c6;margin-top:1px;line-height:1.3}.day{display:flex;align-items:baseline;gap:8px;padding:13px 2px 7px;font-size:13px;font-weight:650}.day span{font-size:11px;color:#6f7889;font-weight:400}.irow{display:flex;gap:10px;margin-bottom:8px}.it{flex:0 0 42px;font-size:10.5px;color:#6f7889;padding-top:9px;text-align:right}.ic{flex:1;border-radius:10px;border:1px solid;padding:8px 11px 8px 13px;position:relative;overflow:hidden;text-align:left}.ic::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--c)}.ic b{font-size:12.5px;font-weight:650}.ic span{display:block;font-size:10.5px;color:#a3abbc;margin-top:2px}.empty{margin-left:52px;border:1px dashed rgba(255,255,255,.14);border-radius:10px;padding:12px 0;text-align:center;color:#5d6675;font-size:11px}.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;background:linear-gradient(180deg,#74a5fb,#5b8def);color:#08101f;font-weight:750;font-size:13.5px;padding:12px 24px;border-radius:999px;border:0;box-shadow:0 12px 28px rgba(91,141,239,.35);white-space:nowrap}.dim{position:fixed;inset:0;z-index:40;background:rgba(3,5,9,.55)}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#121722;border-top:1px solid #232a38;border-radius:22px 22px 0 0;padding:10px 20px 24px;max-width:560px;margin:0 auto;text-align:left;max-height:88vh;overflow-y:auto}.grab{width:40px;height:4px;border-radius:2px;background:#2b3344;margin:2px auto 12px}.t2{display:inline-block;font-size:10.5px;font-weight:650;padding:3px 9px;border-radius:6px;margin-bottom:9px}.sheet h3{font-size:18px;font-weight:750;margin-bottom:11px}.rows{display:grid;gap:7px;margin-bottom:10px}.row2{display:flex;gap:10px;font-size:12px;align-items:baseline}.row2 .k{flex:0 0 34px;color:#6f7889;font-size:11px}.row2 .v{color:#dfe3ea}.note{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:9px 11px;font-size:11.5px;color:#aab2c2;line-height:1.6;margin-bottom:10px}.note em{font-style:normal;color:#6f7889}.btns{display:flex;gap:10px;margin-top:6px}.b1{flex:1;background:linear-gradient(180deg,#74a5fb,#5b8def);color:#08101f;font-weight:750;font-size:14px;padding:13px 0;border-radius:13px;border:0}.b2{flex:0 0 96px;background:transparent;border:1px solid #2b3344;color:#aab2c2;font-size:14px;border-radius:13px}.fl{margin-bottom:10px;font-size:11px;color:#8d96a8;text-align:left}.fl input{display:block;width:100%;margin-top:5px;background:#0b0e14;border:1px solid #2b3548;border-radius:9px;color:#e9ebf0;font-size:13px;padding:9px 11px;font-family:inherit}.fl2{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:#8d96a8;text-align:left}.fl2 input{flex:1;min-width:0;background:#0b0e14;border:1px solid #2b3548;border-radius:9px;color:#e9ebf0;font-size:13px;padding:8px 10px;font-family:inherit}.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.tchip{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#9aa3b4;cursor:pointer}.tchip.on{background:#e9ebf0;color:#0b0e14;border-color:transparent;font-weight:650}.mgr{margin-top:12px;text-align:center;font-size:11px;color:#6f7889}.mgr a{color:#7ba6f5;cursor:pointer;text-decoration:underline}.hidden{display:none !important}
</style>
</head>
<body>
<script src="data.js"></script>
<script>
(function(){
  if (document.getElementById('app')) return;
  if (typeof DATA === 'undefined') { document.body.insertAdjacentHTML('afterbegin', '<div style="padding:40px 20px;color:#e9ebf0">没找到 data.js —— 请确认 index.html 和 data.js 放在同一个文件夹里。</div>'); return; }
  var DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
  var HOUR = 44;
  var STORE_KEY = 'myweek-v1';
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
  function hm(t){ var p = String(t||'0:0').split(':'); return (parseInt(p[0],10)||0) + (parseInt(p[1],10)||0)/60; }
  function isHex(c){ return /^#[0-9a-fA-F]{6}$/.test(String(c||'')); }
  function rgba(hex, a){ var n = parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  function loadStored(){ try { var s = localStorage.getItem(STORE_KEY); if (!s) return null; var o = JSON.parse(s); if (o && o.events && o.types) return o; } catch(e){} return null; }
  var STATE = loadStored() || JSON.parse(JSON.stringify(DATA));
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch(e){} }
  function colorOf(t){ var c = STATE.types[t]; return isHex(c) ? c : '#94a3b8'; }
  function calcRange(){
    var mn = 25, mx = -1;
    STATE.events.forEach(function(e){ mn = Math.min(mn, hm(e.start)); mx = Math.max(mx, hm(e.end)); });
    if (mx < 0) return { s: 8, e: 22 };
    return { s: Math.max(0, Math.floor(mn) - 1), e: Math.min(24, Math.ceil(mx) + 1) };
  }
  function layout(evs){
    var items = evs.map(function(e){ return { e: e, s: hm(e.start), t: hm(e.end), lane: 0, lanes: 1 }; });
    var out = [], cluster = [], laneEnds = [];
    function flush(){ var L = laneEnds.length || 1; for (var q = 0; q < cluster.length; q++){ cluster[q].lanes = L; out.push(cluster[q]); } cluster = []; laneEnds = []; }
    items.forEach(function(it){
      var mx = -1;
      for (var k = 0; k < laneEnds.length; k++){ if (laneEnds[k] > mx) mx = laneEnds[k]; }
      if (cluster.length && it.s >= mx) flush();
      var placed = false;
      for (var k2 = 0; k2 < laneEnds.length; k2++){ if (it.s >= laneEnds[k2]) { it.lane = k2; laneEnds[k2] = it.t; placed = true; break; } }
      if (!placed) { it.lane = laneEnds.length; laneEnds.push(it.t); }
      cluster.push(it);
    });
    flush();
    return out;
  }
  document.body.insertAdjacentHTML('afterbegin', '<div class="wrap" id="app">'
    + '<header class="hd"><div><div class="title">日程</div><div class="sub">每周循环 · 全天 · 时间轴自动适配</div></div>'
    + '<span class="seg"><button id="segG" class="on">横排</button><button id="segL">竖排</button></span></header>'
    + '<div class="chips" id="chips"></div>'
    + '<main id="grid" aria-label="横排视图"></main>'
    + '<main id="list" class="hidden" aria-label="竖排视图"></main>'
    + '</div>'
    + '<button class="fab" id="fab">＋ 输入信息</button>'
    + '<div class="dim hidden" id="dim"></div>'
    + '<div class="sheet hidden" id="sheet"></div>'
    + '<div class="sheet hidden" id="form">'
    + '<div class="grab"></div>'
    + '<h3 id="formTitle">添加一条安排</h3>'
    + '<div class="fl">名称<input id="fTitle" placeholder="例如：正式课程 / 交作业"></div>'
    + '<div class="fl">类型<div class="tchips" id="fType"></div></div>'
    + '<div class="fl">周几<div class="tchips" id="fDay"></div></div>'
    + '<div class="fl2"><span>时间</span><input type="time" id="fStart" value="18:00"><span>–</span><input type="time" id="fEnd" value="20:00"></div>'
    + '<div class="fl">地点（可空）<input id="fPlace" placeholder="例如：南区食堂三楼"></div>'
    + '<div class="fl">备注（可空，点卡片才看到）<input id="fNote" placeholder="例如：学费见群公告"></div>'
    + '<div class="btns"><button class="b1" id="fSave">保存</button><button class="b2" id="fCancel">取消</button></div>'
    + '<div class="mgr"><a id="fExport">导出 data.js</a> · <a id="fReset">重置</a></div>'
    + '</div>');
  $('#chips').innerHTML = ['全部'].concat(Object.keys(STATE.types)).map(function(t){
    if (t === '全部') return '<button class="chip on" data-t="全部">全部</button>';
    return '<button class="chip" data-t="'+esc(t)+'"><i style="background:'+colorOf(t)+'"></i>'+esc(t)+'</button>';
  }).join('');
  var filter = '全部';
  var modeList = false;
  var currentId = -1;
  var editingId = -1;
  var formSel = { type: '', day: '' };
  function evsOf(day){
    return STATE.events.filter(function(e){ return e.day === day && (filter === '全部' || e.type === filter); })
      .sort(function(a,b){ return hm(a.start) - hm(b.start); });
  }
  function renderGrid(){
    var rg = calcRange(), sH = rg.s, eH = rg.e, TRACK = (eH - sH) * HOUR;
    var labels = '', glines = '', cols = '';
    for (var h = sH; h <= eH; h += 2){ labels += '<span style="top:'+((h-sH)*HOUR)+'px">'+(h<10?'0'+h:h)+':00</span>'; }
    for (var h2 = sH; h2 <= eH; h2++){ glines += '<div class="gl" style="top:'+((h2-sH)*HOUR)+'px"></div>'; }
    DAYS.forEach(function(d){
      var inner = '';
      layout(evsOf(d)).forEach(function(it){
        var e = it.e;
        var top = (hm(e.start) - sH) * HOUR;
        var hgt = Math.max(30, (hm(e.end) - hm(e.start)) * HOUR - 4);
        var c = colorOf(e.type);
        var wpc = 100 / it.lanes, lpc = wpc * it.lane;
        inner += '<div class="ev" data-id="'+STATE.events.indexOf(e)+'" style="top:'+top+'px;height:'+hgt+'px;left:calc('+lpc+'% + 1px);right:auto;width:calc('+wpc+'% - 2px);--c:'+c+';background:'+rgba(c,.15)+';border-color:'+rgba(c,.42)+'"><b>'+esc(e.title)+'</b><i>'+esc(e.start)+' – '+esc(e.end)+'</i></div>';
      });
      cols += '<div class="col"><div class="dh">'+d+'</div><div class="track" style="height:'+TRACK+'px">'+inner+'</div></div>';
    });
    $('#grid').innerHTML = '<div class="gbody"><div class="gut" style="top:34px;height:'+TRACK+'px">'+labels+'</div><div class="glines" style="top:34px;height:'+TRACK+'px">'+glines+'</div><div class="cols">'+cols+'</div></div>';
  }
  function renderList(){
    var html = '';
    DAYS.forEach(function(d){
      var es = evsOf(d);
      html += '<div class="day"><b>'+d+'</b><span>'+(es.length ? es.length + ' 项' : '暂无安排')+'</span></div>';
      if (!es.length){ html += '<div class="empty">这一天还很空</div>'; return; }
      es.forEach(function(e){
        var c = colorOf(e.type);
        html += '<div class="irow"><div class="it">'+esc(e.start)+'</div><div class="ic" data-id="'+STATE.events.indexOf(e)+'" style="--c:'+c+';background:'+rgba(c,.12)+';border-color:'+rgba(c,.35)+'"><b>'+esc(e.title)+'</b><span>'+esc(e.start)+' – '+esc(e.end)+(e.place?' · '+esc(e.place):'')+'</span></div></div>';
      });
    });
    $('#list').innerHTML = html;
  }
  function render(){
    renderGrid(); renderList();
    $('#grid').classList.toggle('hidden', modeList);
    $('#list').classList.toggle('hidden', !modeList);
  }
  function row(k, v){ return '<div class="row2"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>'; }
  function showSheet(id){ $('#sheet').classList.add('hidden'); $('#form').classList.add('hidden'); $('#dim').classList.remove('hidden'); $(id).classList.remove('hidden'); }
  function closeAll(){ $('#dim').classList.add('hidden'); $('#sheet').classList.add('hidden'); $('#form').classList.add('hidden'); }
  function openDetail(id){
    currentId = id;
    var e = STATE.events[id];
    if (!e) return;
    var c = colorOf(e.type);
    $('#sheet').innerHTML = '<div class="grab"></div>'
      + '<span class="t2" style="background:'+rgba(c,.18)+';color:'+c+';border:1px solid '+rgba(c,.35)+'">'+esc(e.type || '未分类')+'</span>'
      + '<h3>'+esc(e.title)+'</h3>'
      + '<div class="rows">' + row('时间', e.day + ' · ' + e.start + ' – ' + e.end) + (e.place ? row('地点', e.place) : '') + (e.source ? row('来源', e.source) : '') + '</div>'
      + (e.note ? '<div class="note"><em>备注</em><br>'+esc(e.note)+'</div>' : '')
      + '<div class="btns"><button class="b1" id="dEdit">编辑</button><button class="b2" id="dDel">删除</button></div>';
    showSheet('#sheet');
    $('#dEdit').onclick = function(){ openForm(currentId); };
    $('#dDel').onclick = function(){
      if (!confirm('删掉「'+e.title+'」？')) return;
      STATE.events.splice(currentId, 1);
      save(); render(); closeAll();
    };
  }
  function renderFormChips(){
    $('#fType').innerHTML = Object.keys(STATE.types).map(function(t){ return '<span class="tchip'+(formSel.type===t?' on':'')+'" data-v="'+esc(t)+'">'+esc(t)+'</span>'; }).join('');
    $('#fDay').innerHTML = DAYS.map(function(d){ return '<span class="tchip'+(formSel.day===d?' on':'')+'" data-v="'+d+'">'+d+'</span>'; }).join('');
  }
  function openForm(id){
    editingId = (typeof id === 'number') ? id : -1;
    var e = editingId > -1 ? STATE.events[editingId] : null;
    $('#formTitle').textContent = e ? '修改这条安排' : '添加一条安排';
    $('#fTitle').value = e ? e.title : '';
    $('#fStart').value = e ? e.start : '18:00';
    $('#fEnd').value = e ? e.end : '20:00';
    $('#fPlace').value = (e && e.place) ? e.place : '';
    $('#fNote').value = (e && e.note) ? e.note : '';
    formSel.type = e ? e.type : '';
    formSel.day = e ? e.day : '';
    renderFormChips();
    showSheet('#form');
  }
  $('#chips').addEventListener('click', function(ev){
    var b = ev.target.closest('.chip');
    if (!b) return;
    filter = b.getAttribute('data-t');
    Array.prototype.forEach.call($('#chips').children, function(c){ c.classList.toggle('on', c === b); });
    render();
  });
  document.addEventListener('click', function(ev){
    var card = ev.target.closest('.ev') || ev.target.closest('.ic');
    if (card) openDetail(parseInt(card.getAttribute('data-id'), 10));
  });
  $('#dim').addEventListener('click', closeAll);
  $('#segG').addEventListener('click', function(){ modeList = false; $('#segG').classList.add('on'); $('#segL').classList.remove('on'); render(); });
  $('#segL').addEventListener('click', function(){ modeList = true; $('#segL').classList.add('on'); $('#segG').classList.remove('on'); render(); });
  $('#fab').addEventListener('click', function(){ openForm(); });
  $('#form').addEventListener('click', function(ev){
    var c = ev.target.closest('.tchip');
    if (!c) return;
    var v = c.getAttribute('data-v');
    if (c.parentNode.id === 'fType') { formSel.type = v; }
    else if (c.parentNode.id === 'fDay') { formSel.day = v; }
    renderFormChips();
  });
  $('#fSave').addEventListener('click', function(){
    var t = $('#fTitle').value.trim();
    if (!t) { alert('先给它起个名字吧'); return; }
    if (!formSel.type) { alert('选一个类型（它决定颜色）'); return; }
    if (!formSel.day) { alert('选一天（周几）'); return; }
    var st0 = $('#fStart').value, en0 = $('#fEnd').value;
    if (!st0 || !en0) { alert('填一下开始和结束时间'); return; }
    if (hm(en0) <= hm(st0)) { alert('结束时间要晚于开始时间'); return; }
    var obj = { title: t, day: formSel.day, start: st0, end: en0, type: formSel.type };
    var pl = $('#fPlace').value.trim(); if (pl) obj.place = pl;
    var nt = $('#fNote').value.trim(); if (nt) obj.note = nt;
    if (editingId > -1) { if (STATE.events[editingId].source) obj.source = STATE.events[editingId].source; STATE.events[editingId] = obj; }
    else { STATE.events.push(obj); }
    save(); render(); closeAll();
  });
  $('#fCancel').addEventListener('click', closeAll);
  $('#fExport').addEventListener('click', function(){
    var NL = String.fromCharCode(10);
    var s = '/* 每周日程 · 数据文件（由网页导出） */' + NL + 'var DATA = ' + JSON.stringify(STATE, null, 2) + ';' + NL;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([s], { type: 'text/javascript;charset=utf-8' }));
    a.download = 'data.js';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
  });
  $('#fReset').addEventListener('click', function(){
    if (!confirm('清空网页里的改动，恢复成 data.js 的初始内容？')) return;
    try { localStorage.removeItem(STORE_KEY); } catch(e) {}
    STATE = JSON.parse(JSON.stringify(DATA));
    render(); closeAll();
  });
  render();
})();
</script>
</body>
</html>
